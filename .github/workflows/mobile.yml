name: Android builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed Android APK and AAB (main only; requires mobile-release secrets)
        type: boolean
        default: false
      build_number:
        description: New store build number, greater than previously uploaded versions
        type: string
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require main for signed releases
        if: inputs.signed && github.ref != 'refs/heads/main'
        run: echo 'Signed releases must run from main after review.' && exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            mobile/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix mobile ci
      - run: npm run check
      - run: npm run update:csp
      - run: npm run mobile:build
      - run: npm --prefix server audit --audit-level=high
      - run: npm --prefix mobile audit --audit-level=high

  android:
    needs: quality
    if: ${{ !inputs.signed || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ${{ inputs.signed && 'mobile-release' || 'mobile-ci' }}
    env:
      PALATEO_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      PALATEO_SIGN_RELEASE: ${{ inputs.signed && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate build number
        shell: bash
        run: |
          [[ "$PALATEO_BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] && (( PALATEO_BUILD_NUMBER <= 2100000000 ))
      - run: npm --prefix mobile ci
      - name: Bundle web assets and sync Android
        working-directory: mobile
        run: npm run build && npx cap sync android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Android lint and debug APK
        if: ${{ !inputs.signed }}
        working-directory: mobile/android
        run: bash gradlew --no-daemon lintRelease assembleDebug bundleRelease
      - name: Signed Android release
        if: inputs.signed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/palateo-upload.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          cd mobile/android
          bash gradlew --no-daemon lintRelease assembleRelease bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: palateo-android-${{ inputs.signed && 'signed' || 'test' }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/reports/lint-results-release.html
